<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#07050c" />
<meta name="color-scheme" content="dark" />
<title>CRASH — Time Bomb Games</title>
<link rel="icon" href="/shared/crash.jpg" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+Ethiopic:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/crash/style.css?v=1" />
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="back" id="backBtn" href="/" aria-label="Back to games">‹</a>
    <div class="brand">
      <img class="logo" src="/shared/crash.jpg" alt="Crash" />
      <div>
        <b>CRASH</b>
        <small data-i18n="crash.tagline">Fly high, cash out</small>
      </div>
    </div>
    <div class="top-right">
      <button class="icon-btn" id="muteBtn" type="button" aria-label="Sound" aria-pressed="false">
        <span id="muteIcon">🔊</span>
      </button>
      <button class="lang-btn" data-lang-toggle type="button" aria-label="Switch language">
        <span data-lang-label>አማርኛ</span>
      </button>
      <a class="wallet-chip" id="walletChip" href="/?wallet=1" aria-label="Wallet">
        <b id="balance">0</b>
        <small data-i18n="common.etb">ETB</small>
      </a>
    </div>
  </header>

  <main>
    <section class="stage" id="stage" data-phase="betting">
      <div class="history" id="history" aria-label="Recent crashes"></div>

      <div class="chart-wrap">
        <canvas id="chart" aria-hidden="true"></canvas>
        <div class="chart-fade" aria-hidden="true"></div>

        <div class="readout">
          <div class="mult" id="mult">1.00<span>x</span></div>
          <div class="stage-status" id="stageStatus">BETTING OPEN</div>
        </div>

        <div class="crash-flash" id="crashFlash" aria-hidden="true"></div>
      </div>

      <div class="fair-row">
        <span class="fair-tag" data-i18n="crash.fair">PROVABLY FAIR</span>
        <code id="seedInfo">…</code>
        <button class="copy-mini" id="copySeed" type="button" hidden data-i18n="crash.copy">copy</button>
      </div>
    </section>

    <section class="bet-card">
      <div class="amount-row">
        <label class="amount-field" for="amount">
          <span data-i18n="crash.amount">Bet amount</span>
          <div class="amount-input">
            <button class="step" type="button" data-step="-1" aria-label="Decrease">−</button>
            <input id="amount" type="number" inputmode="numeric" min="10" step="10" value="50" />
            <button class="step" type="button" data-step="1" aria-label="Increase">+</button>
          </div>
        </label>
        <div class="quick" id="quick">
          <button type="button" data-amount="50">50</button>
          <button type="button" data-amount="100">100</button>
          <button type="button" data-amount="250">250</button>
          <button type="button" data-amount="500">500</button>
        </div>
      </div>

      <div class="auto-row">
        <label class="auto-toggle" for="autoOn">
          <input type="checkbox" id="autoOn" />
          <span class="switch" aria-hidden="true"></span>
          <b data-i18n="crash.auto">Auto cash out</b>
        </label>
        <div class="auto-value">
          <input id="autoAt" type="number" inputmode="decimal" min="1.01" step="0.1" value="2.00" disabled />
          <span>x</span>
        </div>
      </div>

      <button class="action" id="actionBtn" type="button" data-mode="bet">BET 50 ETB</button>
      <p class="bet-hint" id="betHint"></p>
    </section>

    <section class="players-card">
      <div class="players-head">
        <h2 data-i18n="crash.players">Players this round</h2>
        <span id="playerCount">0</span>
      </div>
      <ul class="bet-list" id="betList"></ul>
    </section>
  </main>

  <p class="fineprint" data-i18n="crash.footer">Cash out before the rocket flies away. The house keeps a small edge, the rest is yours.</p>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/shared/i18n.js?v=10"></script>
<script src="/crash/app.js?v=7"></script>
</body>
</html>
